# Servicios locales de Escenara. Puertos fijos del proyecto:
#   PostgreSQL 5421 (5432 dentro) · SeaweedFS S3 8321 (8333 dentro)
# La aplicación web se arranca aparte con `pnpm dev` en el puerto 3021.
name: escenara

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-escenara}
      POSTGRES_USER: ${POSTGRES_USER:-escenara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "5421:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: >-
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.allowedOrigins=http://localhost:3021
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Define S3_ACCESS_KEY_ID en .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Define S3_SECRET_ACCESS_KEY en .env}
    ports:
      - "8321:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea el bucket de la aplicación si no existe y termina.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 >/dev/null 2>&1; do sleep 2; done;
        echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$${S3_BUCKET}"
        || echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=seaweedfs:9333
    environment:
      S3_BUCKET: ${S3_BUCKET:-escenara}
    restart: "no"

volumes:
  postgres-data:
  seaweedfs-data:
