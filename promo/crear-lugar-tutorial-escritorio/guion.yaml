# Tutorial «Crear un lugar» en modo tutorial, versión de ESCRITORIO (YouTube): la ventana del navegador, fija,
# ocupa el encuadre. La versión móvil (../crear-lugar-tutorial/) tiene el mismo guion.
# Sin voz: cada escena lleva un rótulo breve (titulo) y sus frases salen como subtítulos.
# Se crea la ficha en «Lugares», su foto se genera dentro de la ficha («Generar una imagen»), se marca como maestra
# y se declara. Lugar inventado, sin marcas ni personas. Evidencia: briefing.md.
escenas:
  - id: gancho
    pieza: rotulo
    parametros: { titulo: "Crea tu lugar", subtitulo: "Su ficha, su foto y su declaración", fondo: claro, animacion: palabras }
    frases:
      - texto: "Vamos a crear un lugar para tus escenas: le damos su ficha, generamos su foto sin salir de ella y la declaramos."

  - id: nuevo
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: nuevo, titulo: "Nuevo lugar" }
    frases:
      - texto: "En «Lugares», toca «Crear el primero»."
      - texto: "Si es un sitio famoso no hace falta: basta con nombrarlo en la escena."

  - id: datos
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: datos, titulo: "Nombre y descripción" }
    frases:
      - texto: "Ponle un nombre y describe lo que lo hace reconocible: materiales, colores, muebles y luz. De ahí sale su foto."

  - id: acabado
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: acabado, titulo: "Real o animado" }
    frases:
      - texto: "Elige el acabado: real, con fotos, o animado en uno de sus estilos. Después no se puede cambiar."

  - id: crear
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: crear, titulo: "Crea su ficha" }
    frases:
      - texto: "Toca «Crear lugar». Su ficha te dice lo que falta para usarlo: la foto maestra y la declaración."

  - id: generar
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: generar, titulo: "Genera su foto" }
    frases:
      - texto: "En «Fotos», toca «Generar una imagen»: una foto realista del lugar, vacía, desde su descripción. Antes ves lo que cuesta."

  - id: encargar
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: encargar, titulo: "Confirma y encarga" }
    frases:
      - texto: "Confirma que puedes usar lo que se genere y toca «Encargar»."

  - id: resultado
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: resultado, titulo: "La foto, en su ficha" }
    frases:
      - texto: "Al terminar, la foto entra en la ficha marcada como generada."

  - id: maestra
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: maestra, titulo: "La foto maestra" }
    frases:
      - texto: "Márcala como maestra: el plano general con la luz de referencia, la única que se envía al generar."
      - texto: "Si añades más, pueden ser un contraplano, un detalle o una zona concreta."

  - id: procedencia
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: procedencia, titulo: "¿De dónde son las fotos?" }
    frases:
      - texto: "Sin declaración no se genera con el lugar. Primero, de dónde salen las fotos: aquí, «Las he generado aquí»."

  - id: sitio
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: sitio, titulo: "Tipo de sitio y gente" }
    frases:
      - texto: "Indica si es un exterior o un interior, y si sale gente. Con gente reconocible no se puede usar."

  - id: uso
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: uso, titulo: "Personal o comercial" }
    frases:
      - texto: "Elige el uso: personal, para tus redes, o comercial, en un anuncio o para una marca."

  - id: declarar
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: declarar, titulo: "Declara" }
    frases:
      - texto: "Confirma que puedes usar estas imágenes y que no sale ningún menor, y toca «Declarar». Se guarda con su fecha."

  - id: listo
    pieza: tutorial
    parametros: { grabacion: lugar, tramo: listo, titulo: "Lugar listo" }
    frases:
      - texto: "Terraza Mirto ya está en tus lugares, lista para tus escenas."

  - id: cierre
    pieza: logo
    parametros: { lema: "Crea tu primer lugar", url: "escenara.com", fondo: claro }
    transicion: fundido
    frases:
      - texto: "Pruébalo en escenara.com y tienes la guía completa en docs.escenara.com."
        hablado: "Pruébalo en escenara punto com y tienes la guía completa en la documentación."
